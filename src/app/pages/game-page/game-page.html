<div class="game-panel game-page">

  <div class="game-page-header">
    <button routerLink="/" class="back-button">
      <i class="bi bi-arrow-left"></i> Back
    </button>

    @if (gameType) {
      <h2 class="game-page-title">{{ gameType.displayName }}</h2>
    }
  </div>

  @if (errorMessage) {
  <div class="game-error">
    <div class="game-error-code">404</div>
    <p class="game-error-message">{{ errorMessage }}</p>
  </div>
  }

  @if (gameType) {
  <div class="game-content">
    <div class="main-stage-area">
      <app-puzzle-board
        [gameType]="gameType"
        [solvedTaskIds]="solvedTaskIds"
        [taskFinished]="taskFinished"
        (verifyRequested)="markAsSolved($event)"
        (taskStarted)="startTask()">
      </app-puzzle-board>
    </div>
  </div>
  }

</div>
