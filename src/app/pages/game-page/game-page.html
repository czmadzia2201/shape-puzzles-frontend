<div class="game-panel game-page">

  <div class="game-page-header">
    <div class="game-page-header-actions">
      <button routerLink="/" class="back-button">
        <i class="bi bi-arrow-left"></i> Back
      </button>
      @if (gameType) {
        <button type="button" class="about-game-type-button" (click)="aboutGameTypeDialog.open()">
          About {{ gameType.displayName }}
        </button>
      }
    </div>

    @if (gameType) {
      <h2>{{ gameType.displayName }}</h2>
    }
  </div>

  @if (errorMessage) {
  <div class="game-error">
    <div class="game-error-code">{{ errorCode }}</div>
    <p class="game-error-message">{{ errorMessage }}</p>
  </div>
  }

  @if (gameType) {
  <div class="game-content">
    <div class="main-stage-area">
      <app-puzzle-board
        [gameType]="gameType"
        [solvedTaskIds]="solvedTaskIds"
        [taskFinished]="taskFinished"
        (verifyRequested)="verifyAndSaveSolution($event)"
        (taskStarted)="startTask()">
      </app-puzzle-board>
    </div>
  </div>
  }

</div>

<app-solution-result-dialog #solutionResultDialog [solutionResultMessages]="solutionResultMessages"></app-solution-result-dialog>
<app-about-game-type-dialog #aboutGameTypeDialog [gameType]="gameType"></app-about-game-type-dialog>
