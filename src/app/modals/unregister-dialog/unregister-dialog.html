<dialog #dialog>

  <div class="dialog-backdrop">
    <div class="dialog-window auth-dialog">
      <h2>Delete account</h2>

      <p>Are you sure you want to delete your account?</p>

      <div class="dialog-actions">
        <button type="button"
                class="dialog-button confirm-button"
                (click)="deleteAccount()">
          OK
        </button>

        <button type="button"
                class="dialog-button"
                (click)="close()">
          Cancel
        </button>
      </div>

    </div>
  </div>
</dialog>
